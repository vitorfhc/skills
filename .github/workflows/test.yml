name: Test skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: >-
          python -m py_compile
          skills/discord-webhooks/scripts/config.py
          skills/discord-webhooks/scripts/send.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify npx skills discovery
        run: |
          skills="$(npx --yes skills add . --list)"
          grep discord-webhooks <<<"$skills"
          grep motion-design-video <<<"$skills"
          grep guided-goal <<<"$skills"

      - name: Verify isolated Codex installation
        run: |
          install_dir="$(mktemp -d)"
          cd "$install_dir"
          npx --yes skills add "$GITHUB_WORKSPACE" \
            --skill discord-webhooks \
            --agent codex \
            --yes \
            --copy
          test -f .agents/skills/discord-webhooks/SKILL.md
          test -x .agents/skills/discord-webhooks/scripts/config.py
          test -x .agents/skills/discord-webhooks/scripts/send.py
